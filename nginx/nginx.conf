# ============================================
# Nginx reverse proxy для AI Business Reporting Platform
# ============================================

upstream django_api {
    server api:8000;
}

upstream notification_api {
    server notification-service:8001;
}

server {
    listen 80;
    server_name localhost;

    # Максимальный размер тела запроса (PDF, uploads)
    client_max_body_size 20M;

    # Gzip сжатие
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 1000;

    # ============================================
    # Static files (Django staticfiles)
    # ============================================
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # Media files (PDF отчёты)
    # ============================================
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================
    # Django API и Admin
    # ============================================
    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Notification Service (FastAPI)
    # /notify/ -> notification-service:8001/
    # ============================================
    location /notify/ {
        proxy_pass http://notification_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Root — заглушка с информацией
    # ============================================
    location / {
        default_type application/json;
        return 200 '{"service": "ai-business-reporting-platform", "api": "/api/v1/", "notifications": "/notify/", "docs": "/api/docs/"}';
    }
}
