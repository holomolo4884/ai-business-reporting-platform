services:
  db:
    image: postgres:16
    container_name: reporting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reporting}
      POSTGRES_USER: ${POSTGRES_USER:-reporting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reporting}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reporting} -d ${POSTGRES_DB:-reporting}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
