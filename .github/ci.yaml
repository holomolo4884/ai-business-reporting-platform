name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Линтеры
  # ==========================================
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install linters
        run: |
          pip install ruff black

      - name: Check backend with ruff
        run: |
          ruff check backend/

      - name: Check backend with black
        run: |
          black --check backend/

      - name: Check notification-service with ruff
        if: hashFiles('notification-service/requirements.txt') != ''
        run: |
          ruff check notification-service/

      - name: Check notification-service with black
        if: hashFiles('notification-service/requirements.txt') != ''
        run: |
          black --check notification-service/

  # ==========================================
  # Тесты backend (Django + pytest)
  # ==========================================
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    # Сервисы, нужные тестам: PostgreSQL и Redis
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # Переменные окружения
    env:
      DJANGO_SECRET_KEY: fake-secret-key-for-ci
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      AI_PROVIDER: fake
      NOTIFICATION_SERVICE_URL: http://localhost:8001
      NOTIFICATION_INTERNAL_API_KEY: fake-notification-key
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      # Системные библиотеки для WeasyPrint (PDF-тесты)
      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu \
            fonts-liberation

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          if [ -f "backend/requirements/base.txt" ]; then
            pip install -r backend/requirements/base.txt
          fi
          if [ -f "backend/requirements/dev.txt" ]; then
            pip install -r backend/requirements/dev.txt
          else
            # Fallback if dev.txt doesn't exist - install test dependencies explicitly
            pip install pytest pytest-django pytest-cov factory-boy faker
          fi

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest -v --cov=. --cov-report=term-missing

  # ==========================================
  # Сборка Docker-образов
  # ==========================================
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: |
          docker compose config --quiet

      - name: Build backend image
        run: |
          docker build -t backend-image -f backend/Dockerfile .

      - name: Build notification-service image
        if: hashFiles('notification-service/Dockerfile') != ''
        run: |
          docker build -t notification-service-image -f notification-service/Dockerfile .
