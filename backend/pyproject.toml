[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "accounts",
    "organizations",
    "business_data",
    "metrics",
    "reports",
    "ai",
    "notifications",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
strict = false
exclude = [
    "migrations",
    ".venv",
    "venv",
]
